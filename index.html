<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qwen3.5 2B · Local WASM Chat</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#191e28;--text:#eef2f8;--muted:#9aa4b5;--line:#29313e;--accent:#7d9cff;--ok:#55d187;--bad:#ff6878}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--text)}
button,input,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
button{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;transition:background .2s}
button:hover:not(:disabled){background:#8fa9ff}button:disabled{background:var(--muted);opacity:.5;cursor:not-allowed}
textarea{resize:none}.container{display:flex;height:100vh;width:100%;overflow:hidden}
@media(max-width:768px){.container{flex-direction:column}}
.sidebar{width:300px;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
@media(max-width:768px){.sidebar{width:100%;height:auto;max-height:50vh;border-right:none;border-bottom:1px solid var(--line);padding:12px;order:2}}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}@media(max-width:768px){.main{order:1}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.small{font-size:12px;color:var(--muted)}.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0}
.bar{height:100%;background:var(--accent);transition:width .3s;width:0}
.log{font-size:11px;font-family:monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;height:100px;overflow-y:auto;color:var(--muted);line-height:1.4;word-break:break-word}
@media(max-width:768px){.log{height:60px}}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.message{display:flex;gap:8px;animation:slideIn .3s}.user .text{background:var(--accent);color:var(--bg);margin-left:auto}
.assistant .text{background:var(--panel2);color:var(--text)}
.text{padding:10px;border-radius:6px;max-width:85%;word-wrap:break-word;font-size:13px;line-height:1.4;white-space:pre-wrap}
.user{display:flex;justify-content:flex-end}.assistant{display:flex;justify-content:flex-start}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel);flex-shrink:0}
textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;min-height:50px;max-height:150px;width:100%}
.sendrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.file-inputs{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.file-input-row{display:flex;gap:6px;align-items:center}
.file-input-row input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--text);font-size:12px}
.file-input-row button{flex:0 0 auto;padding:6px 12px;font-size:12px}
.loaded-files{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.loaded-file{background:var(--bg);border-left:3px solid var(--ok);padding:6px 8px;border-radius:3px;font-size:11px;word-break:break-all;display:flex;justify-content:space-between;align-items:center}
.loaded-file .remove{background:var(--bad);color:var(--bg);border:none;padding:2px 6px;font-size:10px;border-radius:3px;cursor:pointer;margin-left:6px}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<div class="brand" style="font-size:15px;font-weight:600;margin-bottom:12px">Qwen3.5 2B · Local WASM Chat</div>
<div class="muted">Run raw ONNX models locally</div>
<div class="card">
<div class="label">Model Status</div>
<div id="state" class="small">No model loaded</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="prog" class="small" style="margin-top:4px">Ready</div>
</div>
<div class="card">
<div class="label">Automatic model download</div>
<div id="load-status" class="small">Preparing Qwen3.5 2B q4f16…</div>
<div id="download-size" class="small" style="margin-top:6px"></div>
</div>
<div class="card">
<div class="label">Settings</div>
<label style="font-size:12px;display:block;margin-bottom:6px">Max Tokens: <span id="tv">50</span></label>
<input id="temp" type="range" min="10" max="500" step="10" value="50">
</div>
<div class="card">
<div class="label">Log</div>
<div id="log" class="log">Starting automatic model download…</div>
</div>
</div>
<div class="main">
<header class="top">
<div style="font-weight:600">Chat</div>
<div class="small" id="status-text">Model: Not loaded</div>
</header>
<section id="chat" class="chat">
<div class="empty">
<h3 style="margin:0 0 10px 0">Local ONNX Chat</h3>
<p style="margin:0;font-size:12px">The model loads automatically from Hugging Face</p>
</div>
</section>
<footer class="composer">
<textarea id="input" disabled placeholder="Load a model first..."></textarea>
<div class="sendrow">
<span class="small">Enter = send</span>
<button id="send" disabled>Send</button>
</div>
</footer>
</div>
</div>

<script type="module">
import { AutoTokenizer, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;
env.allowRemoteModels = true;
env.useBrowserCache = true;
// Keep model/tokenizer assets local; no inference request leaves the browser.
env.localModelPath = "./models/";

let ort = null;
let session = null;
let tokenizer = null;
let busy = false;
let messages = [];
let onnxFile = null;
let dataFile = null;
let kvCache = {};
let currentLength = 0;

const $ = id => document.getElementById(id);

function log(msg) {
    const el = $("log");
    el.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
    el.scrollTop = el.scrollHeight;
}

function render() {
    const chat = $("chat");
    if (!messages.length) {
        chat.innerHTML = '<div class="empty"><h3 style="margin:0 0 10px 0">Local ONNX Chat</h3><p style="margin:0;font-size:12px">The model loads automatically from Hugging Face</p></div>';
        return;
    }
    chat.innerHTML = "";
    for (const m of messages) {
        const div = document.createElement("div");
        div.className = `message ${m.role}`;
        div.innerHTML = `<div class="text">${m.content.replace(/</g, '&lt;')}</div>`;
        chat.appendChild(div);
    }
    chat.scrollTop = chat.scrollHeight;
}

function updateFileDisplay() {
    const filesDiv = $("loaded-files");
    filesDiv.innerHTML = "";
    [onnxFile, dataFile].forEach(f => {
        if (!f) return;
        const div = document.createElement("div");
        div.className = "loaded-file";
        div.innerHTML = `<span>✓ ${f.name}</span><button class="remove" onclick="clearFile('${f === onnxFile ? 'onnx' : 'data'}')">✕</button>`;
        filesDiv.appendChild(div);
    });
    const ready = onnxFile && dataFile;
    $("load-btn").disabled = !ready;
    $("load-status").textContent = ready ? "✓ Both files ready!" : `⚠ Need: ${!onnxFile ? '.onnx ' : ''}${!dataFile ? '.onnx_data' : ''}`;
    $("load-status").style.color = ready ? "var(--ok)" : "var(--muted)";
}

window.clearFile = (type) => {
    if (type === 'onnx') { onnxFile = null; $("onnx-input").value = ""; $("onnx-name").value = ""; }
    else { dataFile = null; $("data-input").value = ""; $("data-name").value = ""; }
    updateFileDisplay();
};

$("onnx-input").onchange = e => { if (e.target.files[0]) { onnxFile = e.target.files[0]; $("onnx-name").value = onnxFile.name; updateFileDisplay(); } };
$("data-input").onchange = e => { if (e.target.files[0]) { dataFile = e.target.files[0]; $("data-name").value = dataFile.name; updateFileDisplay(); } };

async function loadOrt() {
    if (ort) return ort;
    log("Loading ONNX Runtime Web (WASM)...");
    const module = await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs');
    ort = module.default || module;
    if (!ort.InferenceSession) {
        throw new Error("ONNX Runtime failed to initialize. Check browser WebGPU support.");
    }
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;
    log("✓ ONNX Runtime loaded");
    return ort;
}

async function loadModel() {
    const base = 'https://huggingface.co/onnx-community/Qwen3.5-2B-ONNX/resolve/main/';
    const modelName = 'decoder_model_merged_q4f16.onnx';
    try {
        const runtime = await loadOrt();
        $("state").textContent = "Downloading Qwen3.5 2B q4f16…";
        $("load-status").textContent = "First load is about 1.1 GB; subsequent loads use the browser cache.";
        $("bar").style.width = "10%";
        log("Fetching the verified onnx-community q4f16 WebAssembly model…");
        const download = async (url, label, start, end) => {
            const response = await fetch(url);
            if (!response.ok || !response.body) throw new Error('Could not download ' + label + ' from Hugging Face.');
            const total = Number(response.headers.get('content-length')) || 0;
            let received = 0; const chunks = []; const reader = response.body.getReader();
            while (true) {
                const {done, value} = await reader.read(); if (done) break;
                chunks.push(value); received += value.byteLength;
                const pct = total ? received / total : 0;
                $("bar").style.width = `${start + pct * (end - start)}%`;
                $("prog").textContent = `${label}: ${(received / 1048576).toFixed(0)} MB${total ? ` / ${(total / 1073741824).toFixed(2)} GB` : ''}`;
            }
            const result = new Uint8Array(received); let offset = 0;
            for (const chunk of chunks) { result.set(chunk, offset); offset += chunk.byteLength; }
            return result.buffer;
        };
        const modelBuf = await download(base + 'onnx/' + modelName, 'Model', 10, 15);
        const dataBuf = await download(base + 'onnx/' + modelName + '_data', 'Weights', 15, 55);
        $("bar").style.width = "55%";
        const externalData = [{ name: modelName + '_data', data: new Uint8Array(dataBuf) }];
        session = await runtime.InferenceSession.create(modelBuf, {
            executionProviders: ['wasm'], graphOptimizationLevel: 'all', externalData
        });
        $("state").textContent = "Loading Qwen3.5 tokenizer…";
        tokenizer = await AutoTokenizer.from_pretrained('onnx-community/Qwen3.5-2B-ONNX', {
            progress_callback: p => { if (p.status === 'progress') $("bar").style.width = `${55 + p.progress * 0.45}%`; }
        });
        kvCache = {}; currentLength = 0;
        session.inputNames.forEach(name => { if (name.includes('past_key_values') || name.includes('cache')) kvCache[name] = null; });
        $("bar").style.width = "100%"; $("state").textContent = "Ready";
        $("status-text").textContent = "Model: Qwen3.5 2B q4f16 · WASM";
        ["input", "send"].forEach(id => $(id).disabled = false);
        log("✓ Qwen3.5 2B loaded entirely in the browser");
    } catch (e) {
        log(`✗ ${e.message}`); $("state").textContent = "Error"; $("load-status").textContent = `✗ ${e.message}`; console.error(e);
    } finally {  }
}
async function generate(prompt, maxTokens) {
    log(`Tokenizing prompt...`);
    const inputIds = tokenizer.encode(prompt, { add_special_tokens: true });
    let tokens = Array.from(inputIds);
    const outputTokens = [];
    const eosTokenId = tokenizer.eos_token_id ?? 2;

    log(`Starting generation (${tokens.length} input tokens, max ${maxTokens} new)...`);

    for (let i = 0; i < maxTokens; i++) {
        const feeds = {};
        const seqLen = tokens.length;
        const batchSize = 1;

        feeds['input_ids'] = new ort.Tensor('int64', BigInt64Array.from(tokens.map(t => BigInt(t))), [batchSize, seqLen]);
        feeds['attention_mask'] = new ort.Tensor('int64', BigInt64Array.from({ length: seqLen }, () => 1n), [batchSize, seqLen]);
        feeds['position_ids'] = new ort.Tensor('int64', BigInt64Array.from({ length: seqLen }, (_, idx) => BigInt(currentLength + idx)), [batchSize, seqLen]);

        for (const [name, tensor] of Object.entries(kvCache)) {
            if (tensor) {
                feeds[name] = tensor;
            } else {
                throw new Error('This Qwen3.5 export requires its generated cache inputs; reload the complete model directory rather than a raw decoder file.');
            }
        }

        const results = await session.run(feeds);

        const logits = results['logits'];
        const lastTokenLogits = logits.data.slice((seqLen - 1) * logits.dims[2]);
        let nextTokenId = 0;
        let maxVal = -Infinity;
        for (let j = 0; j < lastTokenLogits.length; j++) {
            if (lastTokenLogits[j] > maxVal) {
                maxVal = lastTokenLogits[j];
                nextTokenId = j;
            }
        }

        if (nextTokenId === eosTokenId) break;

        outputTokens.push(nextTokenId);
        tokens = [nextTokenId];
        currentLength += seqLen;

        for (const name of Object.keys(kvCache)) {
            const outName = name.replace('past_key_values', 'present').replace('cache', 'present');
            if (results[outName]) {
                kvCache[name] = results[outName];
            } else if (results[name]) {
                kvCache[name] = results[name];
            }
        }

        if (i % 10 === 0) log(`Generated ${outputTokens.length} tokens...`);
    }

    return tokenizer.decode(outputTokens, { skip_special_tokens: true });
}

async function send() {
    if (!session || !tokenizer || busy) return;
    const text = $("input").value.trim();
    if (!text) return;

    $("input").value = "";
    busy = true;
    $("send").disabled = true;
    messages.push({ role: "user", content: text });
    render();

    try {
        const reply = await generate(text, parseInt($("tv").value));
        messages.push({ role: "assistant", content: reply });
        log(`✓ Generated response (${reply.length} chars)`);
    } catch (e) {
        messages.push({ role: "assistant", content: `[Error: ${e.message}]` });
        log(`✗ ${e.message}`);
        console.error(e);
    } finally {
        render();
        busy = false;
        $("send").disabled = false;
        $("input").focus();
    }
}


loadModel();
$("send").onclick = send;
$("temp").oninput = () => $("tv").textContent = $("temp").value;
$("input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

render();
</script>
</body>
</html>
